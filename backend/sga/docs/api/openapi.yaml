        totalElementos:
          type: integer
          format: int64
          example: 4
        totalPaginas:
          type: integer
          format: int32
          example: 1
  responses:

    DatosInvalidos:
      description: '400: el mensaje está mal formado o le falta un campo (lo detecta Bean Validation).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NoAutenticado:
      description: '401: falta el token (o la credencial del canal) o no es válido.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NoEncontrado:
      description: '404: el identificador no existe (excepciones de application.exception).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ReglaDeNegocio:
      description: '409: el mensaje es válido pero una regla del negocio lo impide (ReglaDominioException).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    SinPermiso:
      description: '403: el rol del usuario no tiene permiso para esta operación.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Usuarios del sistema: huésped, recepción, administrador y personal de servicio (7.2).'
    canalCredencial:
      type: apiKey
      in: header
      name: X-Canal-Credencial
      description: Credencial propia de cada canal externo (7.8, 10.3.1).

security:
- bearerAuth: []
