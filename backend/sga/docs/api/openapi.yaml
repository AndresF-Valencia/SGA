openapi: 3.1.0

info:
  title: API SGA — Hotel Sanrocco
  description: |
    API RESTful del Sistema de Gestión de Alojamiento (SGA) para el Hotel Sanrocco (Armenia, Quindío).

    Alineado estrictamente con Arquitectura Hexagonal, Domain-Driven Design y los casos de uso del backend.

    Reglas de negocio propias (L-20 / RNP):
    - RNP-01: Mínimo de noches obligatorio en Temporada Alta.
    - RNP-02: Límite de mascotas por apartamento y recargo por limpieza ($70.000 COP).
    - RNP-03: Exigencia del 50% de anticipo para confirmar la reserva.
    - RNP-04: La notificación formal de retraso condona y bloquea la declaración de No-Show.

    Seguridad (7.1 y 7.2):
    - Los usuarios inician sesión en POST /api/auth/login y envían el token en `Authorization: Bearer <token>`.
    - Las rutas marcadas con `security: []` son públicas (registro, login, catálogo, disponibilidad y cotización).
    - Los canales externos no usan token: envían su credencial en el encabezado `X-Canal-Credencial`.
    - 401 = falta el token o no es válido. 403 = el rol no tiene permiso, o la reserva es de otro huésped.
    - El alojamiento es único (F-13): ninguna operación pide su identificador.
  version: 1.2.0
  contact:
    name: Grupo Niche
    email: andresf.valenciaa1@uqvirtual.edu.co

servers:
- url: http://localhost:8080
  description: Servidor de desarrollo local

tags:
- name: Autenticación
  description: Registro de huéspedes e inicio de sesión (JWT)
- name: Usuarios
  description: Gestión de usuarios internos (solo administrador)
- name: Reservas
  description: Ciclo de vida de la reserva, cotización y disponibilidad
- name: Folio y Finanzas
  description: Cargos, pagos, correcciones y cierre del folio
- name: Apartamentos y Operación
  description: Detalle, estado operativo, novedades y bloqueos
- name: Alojamiento
  description: Parámetros configurables del alojamiento (sección 6)
- name: Temporadas y Tarifas
  description: Temporadas y tarifas por apartamento
- name: Políticas de Cancelación
  description: Versiones de la política de cancelación
- name: Canal Externo
  description: Contrato del canal externo (10.3.1), autenticado con credencial por canal

paths:

  /api/auth/registro:
    post:
      tags:
      - Autenticación
      summary: Registrarse como huésped
      operationId: registrarHuesped
      description: 'Crea una cuenta con rol HUESPED. El correo no puede estar registrado (409). Pública: no requiere token.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroUsuarioRequest'
      responses:
        '201':
          description: Huésped registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión y obtener el token
      operationId: iniciarSesion
      description: 'Devuelve un JWT que se envía en Authorization: Bearer. Correo o contraseña incorrectos → 401. Pública: no requiere token.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /api/auth/recuperar-contrasena:
    post:
      tags:
      - Autenticación
      summary: Pedir un código para recuperar la contraseña
      operationId: solicitarRecuperacion
      description: 'Envía al correo registrado un código de 6 dígitos que vence en 15 minutos y sirve una sola vez. Responde 202 aunque el correo no exista, para no revelar qué correos tienen cuenta. En modo consola el correo se escribe en el log. Pública: no requiere token.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarRecuperacionRequest'
      responses:
        '202':
          description: Si el correo tiene cuenta activa, se envió el código.
        '400':
          $ref: '#/components/responses/DatosInvalidos'

  /api/auth/restablecer-contrasena:
    post:
      tags:
      - Autenticación
      summary: Poner una contraseña nueva con el código
      operationId: restablecerContrasena
      description: 'El código se anula al usarse, al vencer o tras 5 intentos fallidos. Pública: no requiere token.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerContrasenaRequest'
      responses:
        '204':
          description: Contraseña cambiada.
        '400':
          description: Datos inválidos, o el código no es válido, ya se usó o venció.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/usuarios:
    post:
      tags:
      - Usuarios
      summary: Crear un usuario interno
      operationId: crearUsuario
      description: 'Solo el administrador. Crea recepcionistas, administradores o personal de servicio. Roles: Administrador.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
    get:
      tags:
      - Usuarios
      summary: Listar usuarios
      operationId: listarUsuarios
      description: 'Filtros opcionales por rol y estado; ordenados por nombre. Roles: Administrador.'
      parameters:
      - name: rol
        in: query
        required: false
        schema:
          type: string
          enum: &id016
          - HUESPED
          - RECEPCIONISTA
          - ADMINISTRADOR
          - PERSONAL_SERVICIO
      - name: activo
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUsuarioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401': &id001
          $ref: '#/components/responses/NoAutenticado'
        '403': &id002
          $ref: '#/components/responses/SinPermiso'

  /api/usuarios/me:
    get:
      tags:
      - Usuarios
      summary: Consultar mi perfil
      operationId: consultarMiPerfil
      description: 'El usuario sale del token. Roles: todos.'
      responses:
        '200':
          description: Mi perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags:
      - Usuarios
      summary: Actualizar mi perfil
      operationId: actualizarMiPerfil
      description: 'Nombre, teléfono y foto. El correo no es editable. Roles: todos.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
    delete:
      tags:
      - Usuarios
      summary: Eliminar mi cuenta
      operationId: eliminarMiCuenta
      description: 'Eliminación lógica. No se permite si soy titular de reservas PENDIENTE, CONFIRMADA o EN_CURSO (409). Mis reservas históricas se conservan. Roles: todos.'
      responses:
        '204':
          description: Cuenta eliminada.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/usuarios/me/contrasena:
    put:
      tags:
      - Usuarios
      summary: Cambiar mi contraseña
      operationId: cambiarMiContrasena
      description: 'Con la contraseña actual y la nueva. Actual incorrecta → 409. Roles: todos.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequest'
      responses:
        '204':
          description: Contraseña cambiada.
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/usuarios/{correo}:
    get:
      tags:
      - Usuarios
      summary: Consultar un usuario
      operationId: consultarUsuario
      description: 'Roles: Administrador.'
      parameters:
      - &id003
        name: correo
        in: path
        required: true
        schema:
          type: string
          format: email
        example: laura@example.com
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401': *id001
        '403': *id002
        '404':
          $ref: '#/components/responses/NoEncontrado'
    delete:
      tags:
      - Usuarios
      summary: Eliminar un usuario
      operationId: eliminarUsuario
      description: 'Eliminación lógica: no se permite si es titular de reservas PENDIENTE, CONFIRMADA o EN_CURSO, ni si es el último administrador activo (409). Roles: Administrador.'
      parameters:
      - *id003
      responses:
        '204':
          description: Usuario eliminado.
        '401': *id001
        '403': *id002
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/usuarios/{correo}/rol:
    put:
      tags:
      - Usuarios
      summary: Cambiar el rol de un usuario
      operationId: cambiarRolUsuario
      description: 'No se permite quitarle el rol al último administrador activo (409). Roles: Administrador.'
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarRolRequest'
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401': *id001
        '403': *id002
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas:
    post:
      tags:
      - Reservas
      summary: Crear una reserva por el canal portal o directo (CU-01)
      operationId: crearReserva
      description: 'Valida, en orden, las seis condiciones de 7.5. El valor y la política quedan congelados (RN-22). Roles: Huésped, Recepcionista, Administrador.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaRequest'
      responses:
        '201':
          description: Reserva creada en estado PENDIENTE; su folio queda abierto con el cargo de alojamiento (F-08).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
          headers:
            Location:
              description: URL de la reserva creada
              schema:
                type: string
                example: /api/reservas/RES-2026-00001
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
    get:
      tags:
      - Reservas
      summary: Listar reservas con filtros (solo recepción y administración)
      operationId: listarReservas
      parameters:
      - name: estado
        in: query
        required: false
        description: Filtra por estado; sin filtro devuelve todas.
        schema:
          type: string
          enum:
          - PENDIENTE
          - CONFIRMADA
          - EN_CURSO
          - FINALIZADA
          - CANCELADA
          - NO_SHOW
      - name: apartamentoId
        in: query
        required: false
        schema:
          type: string
          example: APTO-101
      - name: canalOrigen
        in: query
        required: false
        schema:
          type: string
          enum:
          - PORTAL
          - DIRECTO
          - EXTERNO
      - name: fechaEntradaDesde
        in: query
        required: false
        description: Fecha de entrada mínima, incluida.
        schema:
          type: string
          format: date
      - name: fechaEntradaHasta
        in: query
        required: false
        description: Fecha de entrada máxima, incluida.
        schema:
          type: string
          format: date
      - name: documentoTitular
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de reservas, de la más reciente a la más antigua (7.5).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservaResumen'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
      description: 'Roles: Recepcionista, Administrador.'

  /api/reservas/mis-reservas:
    get:
      tags:
      - Reservas
      summary: Listar las reservas del huésped autenticado
      description: 'El titular sale del token; no se acepta otro documento. De la más reciente a la más antigua. Roles: Huésped.'
      operationId: misReservas
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDIENTE
          - CONFIRMADA
          - EN_CURSO
          - FINALIZADA
          - CANCELADA
          - NO_SHOW
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de reservas del huésped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservaResumen'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /api/reservas/{codigo}:
    get:
      tags:
      - Reservas
      summary: Consultar el detalle de una reserva
      operationId: consultarReserva
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: '403: el rol no tiene permiso, o la reserva pertenece a otro huésped (7.2).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      description: 'Roles: Huésped, Recepcionista, Administrador.'
    put:
      tags:
      - Reservas
      summary: Modificar fechas, apartamento o mascotas de una reserva no iniciada (CU-05)
      operationId: modificarReserva
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificarReservaRequest'
      responses:
        '200':
          description: Reserva modificada; la diferencia de valor queda como ajuste en el folio (RN-14).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
      description: 'Roles: Recepcionista, Administrador.'

  /api/reservas/{codigo}/confirmar:
    put:
      tags:
      - Reservas
      summary: Confirmar una reserva PENDIENTE (RN-08, RN-09, RNP-03)
      operationId: confirmarReserva
      description: 'Exige hora estimada de llegada y el anticipo del 50 % registrado en el folio. Roles: Recepcionista, Administrador.'
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      responses:
        '200':
          description: Operación ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/cancelar:
    put:
      tags:
      - Reservas
      summary: Cancelar una reserva PENDIENTE o CONFIRMADA (RN-12, RN-13)
      operationId: cancelarReserva
      description: 'La retención se calcula con la política congelada en la reserva y se registra en el folio. Roles: Huésped, Recepcionista, Administrador.'
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarReservaRequest'
      responses:
        '200':
          description: Operación ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/declarar-noshow:
    put:
      tags:
      - Reservas
      summary: Declarar que el titular no se presentó (7.5, RNP-04)
      operationId: declararNoShow
      description: 'Solo desde CONFIRMADA y pasada la hora límite configurada (L-15). Retiene el anticipo. Roles: Recepcionista, Administrador.'
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      responses:
        '200':
          description: Operación ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/registrar-llegada:
    put:
      tags:
      - Reservas
      summary: Registrar la llegada del grupo (check-in) (RN-10, RN-11, RNP-03)
      operationId: registrarLlegada
      description: 'Exige reserva CONFIRMADA, fecha de entrada alcanzada, apartamento PREPARADO y folio pagado. Roles: Recepcionista, Administrador.'
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      responses:
        '200':
          description: Operación ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/registrar-salida:
    put:
      tags:
      - Reservas
      summary: Registrar la salida del grupo (check-out) (RN-17)
      operationId: registrarSalida
      description: 'Cierra el folio (con autorización del administrador si queda saldo), finaliza la reserva y deja el apartamento PENDIENTE_PREPARACION. Roles: Recepcionista, Administrador.'
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarSalidaRequest'
      responses:
        '200':
          description: Operación ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/cotizaciones:
    post:
      tags:
      - Reservas
      summary: Cotizar una estancia con desglose noche por noche (7.4)
      operationId: cotizarEstancia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CotizacionRequest'
      responses:
        '200':
          description: 'Cotización calculada. Responde 200 y no 201: no se crea ningún recurso ni se retienen noches (Guía 07, 4.5).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
      security: []
      description: 'Pública: no requiere token.'

  /api/disponibilidad:
    get:
      tags:
      - Reservas
      summary: Buscar apartamentos disponibles por fechas y tamaño del grupo (7.5)
      operationId: consultarDisponibilidad
      parameters:
      - name: fechaEntrada
        in: query
        required: true
        schema:
          type: string
          format: date
          example: '2026-11-01'
      - name: fechaSalida
        in: query
        required: true
        schema:
          type: string
          format: date
          example: '2026-11-04'
      - name: personas
        in: query
