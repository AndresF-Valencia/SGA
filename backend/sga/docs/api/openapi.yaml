          example: '14:00:00'
        horaSalida:
          type: string
          format: time
          example: '11:00:00'
        horaLimiteNoShow:
          type: string
          format: time
          example: '20:00:00'
        horasPreparacion:
          type: integer
          format: int32
          example: 3
        horasPlazoConfirmacion:
          type: integer
          format: int32
          example: 1
        edadUmbralFacturable:
          type: integer
          format: int32
          example: 5
        exigeAnticipo:
          type: boolean
          example: true
        porcentajeAnticipo:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          example: 50

