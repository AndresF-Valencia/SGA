openapi: 3.1.0
info:
  title: API SGA — Hotel Sanrocco
  description: |
    API RESTful del Sistema de Gestión de Alojamiento (SGA) para el Hotel Sanrocco (Armenia, Quindío).

    Alineado estrictamente con Arquitectura Hexagonal, Domain-Driven Design y los casos de uso del backend.

    Reglas de negocio propias (L-20 / RNP):
    - RNP-01: Mínimo de noches obligatorio en Temporada Alta.
    - RNP-02: Límite de mascotas por apartamento y recargo por limpieza ($70.000 COP).
    - RNP-03: Exigencia del 50% de anticipo para confirmar la reserva.
    - RNP-04: La notificación formal de retraso condona y bloquea la declaración de No-Show.
  version: 1.0.0
  contact:
    name: Grupo Niche
    email: andresf.valenciaa1@uqvirtual.edu.co

servers:
- url: http://localhost:8080
  description: Servidor de desarrollo local

tags:
- name: Reservas
  description: Ciclo de vida de la reserva, cotización y disponibilidad
- name: Folio y Finanzas
  description: Cargos, pagos, correcciones y cierre del folio
- name: Apartamentos y Operación
  description: Detalle, estado operativo, novedades y bloqueos
- name: Alojamiento
  description: Parámetros configurables del alojamiento (sección 6)
- name: Temporadas y Tarifas
  description: Temporadas y tarifas por apartamento
- name: Políticas de Cancelación
  description: Versiones de la política de cancelación
- name: Canal Externo
  description: Contrato del canal externo (10.3.1), autenticado con credencial por canal

paths:

  /api/reservas:
    post:
      tags:
      - Reservas
      summary: Crear una reserva por el canal portal o directo (CU-01)
      operationId: crearReserva
      description: Valida, en orden, las seis condiciones de 7.5. El valor y la política quedan congelados (RN-22).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaRequest'
      responses:
        '201':
          description: Reserva creada en estado PENDIENTE; su folio queda abierto con el cargo de alojamiento (F-08).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
          headers:
            Location:
              description: URL de la reserva creada
              schema:
                type: string
                example: /api/reservas/RES-2026-00001
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
    get:
      tags:
      - Reservas
      summary: Listar reservas por estado (ConsultarReservasPorEstadoUseCase)
      operationId: consultarReservasPorEstado
      parameters:
      - name: estado
        in: query
        required: false
        description: Filtra por estado; sin filtro devuelve todas.
        schema:
          type: string
          enum:
          - PENDIENTE
          - CONFIRMADA
          - EN_CURSO
          - FINALIZADA
          - CANCELADA
          - NO_SHOW
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de reservas, de la más reciente a la más antigua (7.5).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservaResumen'
        '400':
          $ref: '#/components/responses/DatosInvalidos'

  /api/reservas/{codigo}:
    get:
      tags:
      - Reservas
      summary: Consultar el detalle de una reserva
      operationId: consultarReserva
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags:
      - Reservas
      summary: Modificar fechas, apartamento o mascotas de una reserva no iniciada (CU-05)
      operationId: modificarReserva
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificarReservaRequest'
      responses:
        '200':
          description: Reserva modificada; la diferencia de valor queda como ajuste en el folio (RN-14).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/confirmar:
    put:
      tags:
      - Reservas
      summary: Confirmar una reserva PENDIENTE (RN-08, RN-09, RNP-03)
      operationId: confirmarReserva
      description: Exige hora estimada de llegada y el anticipo del 50 % registrado en el folio.
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      responses:
        '200':
          description: Operación ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/cancelar:
    put:
      tags:
      - Reservas
      summary: Cancelar una reserva PENDIENTE o CONFIRMADA (RN-12, RN-13)
      operationId: cancelarReserva
      description: La retención se calcula con la política congelada en la reserva y se registra en el folio.
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarReservaRequest'
      responses:
        '200':
          description: Operación ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/declarar-noshow:
    put:
      tags:
      - Reservas
      summary: Declarar que el titular no se presentó (7.5, RNP-04)
      operationId: declararNoShow
      description: Solo desde CONFIRMADA y pasada la hora límite configurada (L-15). Retiene el anticipo.
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      responses:
        '200':
          description: Operación ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/registrar-llegada:
    put:
      tags:
      - Reservas
      summary: Registrar la llegada del grupo (check-in) (RN-10, RN-11, RNP-03)
      operationId: registrarLlegada
      description: Exige reserva CONFIRMADA, fecha de entrada alcanzada, apartamento PREPARADO y folio pagado.
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      responses:
        '200':
          description: Operación ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/registrar-salida:
    put:
      tags:
      - Reservas
      summary: Registrar la salida del grupo (check-out) (RN-17)
      operationId: registrarSalida
      description: Cierra el folio (con autorización del administrador si queda saldo), finaliza la reserva y deja
        el apartamento PENDIENTE_PREPARACION.
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarSalidaRequest'
      responses:
        '200':
          description: Operación ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/cotizaciones:
    post:
      tags:
      - Reservas
      summary: Cotizar una estancia con desglose noche por noche (7.4)
      operationId: cotizarEstancia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CotizacionRequest'
      responses:
        '200':
          description: 'Cotización calculada. Responde 200 y no 201: no se crea ningún recurso ni se retienen noches
            (Guía 07, 4.5).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/disponibilidad:
    get:
      tags:
      - Reservas
      summary: Buscar apartamentos disponibles por fechas y tamaño del grupo (7.5)
      operationId: consultarDisponibilidad
      parameters:
      - name: fechaEntrada
        in: query
        required: true
        schema:
          type: string
          format: date
          example: '2026-11-01'
      - name: fechaSalida
        in: query
        required: true
        schema:
          type: string
          format: date
          example: '2026-11-04'
      - name: personas
        in: query
        required: true
        description: Total de personas del grupo (todos cuentan para la capacidad, RN-02).
        schema:
          type: integer
          format: int32
          minimum: 1
          example: 2
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Apartamentos disponibles en todas las noches del rango (3.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'

  /api/reservas/{codigo}/folio:
    get:
      tags:
      - Folio y Finanzas
      summary: Consultar el folio con cargos, pagos y saldo (7.7)
      operationId: consultarFolio
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      responses:
        '200':
          description: Folio de la reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/reservas/{codigo}/folio/cargos:
    post:
      tags:
      - Folio y Finanzas
      summary: Registrar un cargo en el folio (servicio adicional)
      operationId: registrarCargo
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarCargoRequest'
      responses:
        '201':
          description: Cargo registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/folio/pagos:
    post:
      tags:
      - Folio y Finanzas
      summary: Registrar un pago con su medio y fecha (RN-15)
      operationId: registrarPago
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarPagoRequest'
      responses:
        '201':
          description: Pago registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/folio/correcciones:
    post:
      tags:
      - Folio y Finanzas
      summary: Corregir un movimiento con un movimiento inverso (RN-16)
      operationId: corregirMovimiento
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorregirMovimientoRequest'
      responses:
        '201':
          description: 'Movimiento inverso registrado. Es POST porque crea un movimiento nuevo: los cargos y pagos
            no se editan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/reservas/{codigo}/folio/cerrar:
    put:
      tags:
      - Folio y Finanzas
      summary: Cerrar el folio con autor y motivo (RN-17)
      operationId: cerrarFolio
      parameters:
      - $ref: '#/components/parameters/CodigoReserva'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CerrarFolioRequest'
      responses:
        '200':
          description: Folio cerrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/apartamentos/estado:
    get:
      tags:
      - Apartamentos y Operación
      summary: Consultar el estado operativo de los apartamentos (7.6)
      operationId: consultarEstadoApartamentos
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Estado operativo actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoEstadoResponse'

  /api/apartamentos/{identificacion}:
    get:
      tags:
      - Apartamentos y Operación
      summary: Consultar el detalle de un apartamento (7.1, 7.3)
      operationId: consultarApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamento'
      responses:
        '200':
          description: Detalle del apartamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoDetalleResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/apartamentos/{identificacion}/estado-operativo:
    post:
      tags:
      - Apartamentos y Operación
      summary: Cambiar el estado operativo de un apartamento (7.6)
      operationId: cambiarEstadoOperativo
      description: El dominio solo acepta las transiciones de 7.6. FUERA_DE_SERVICIO es exclusiva del administrador
        (7.1).
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamento'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoOperativoRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoDetalleResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/apartamentos/{identificacion}/novedades:
    post:
      tags:
      - Apartamentos y Operación
      summary: Registrar una novedad en un apartamento (7.6)
      operationId: registrarNovedad
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamento'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarNovedadRequest'
      responses:
        '201':
          description: Novedad registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NovedadResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    get:
      tags:
      - Apartamentos y Operación
      summary: Consultar el historial de novedades de un apartamento
      operationId: consultarNovedades
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamento'
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de novedades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaNovedad'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/apartamentos/{identificacion}/bloqueos:
    get:
      tags:
      - Apartamentos y Operación
      summary: Consultar los bloqueos de un apartamento
      operationId: consultarBloqueos
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamento'
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de bloqueos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaBloqueo'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/bloqueos:
    post:
      tags:
      - Apartamentos y Operación
      summary: Registrar un bloqueo administrativo (7.3, RN-07)
      operationId: crearBloqueo
      description: No se permite sobre noches que ya tengan reservas activas (7.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearBloqueoRequest'
      responses:
        '201':
          description: Bloqueo registrado en estado VIGENTE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueoResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/apartamentos/{identificacion}/tarifas/{temporadaId}:
    put:
      tags:
      - Temporadas y Tarifas
      summary: Definir o reemplazar la tarifa de un apartamento en una temporada (7.4)
      operationId: registrarTarifa
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamento'
      - name: temporadaId
        in: path
        required: true
        schema:
          type: string
          example: T-ALTA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarTarifaRequest'
      responses:
        '204':
          description: Tarifa registrada
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

  /api/alojamiento/parametros:
    get:
      tags:
      - Alojamiento
      summary: Consultar los parámetros del alojamiento (7.3)
      operationId: consultarParametrosAlojamiento
      responses:
        '200':
          description: Parámetros vigentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParametrosAlojamientoResponse'
    put:
      tags:
      - Alojamiento
      summary: Configurar los parámetros del alojamiento (sección 6)
      operationId: configurarParametrosAlojamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurarParametrosAlojamientoRequest'
      responses:
        '200':
          description: Parámetros actualizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParametrosAlojamientoResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'

  /api/temporadas:
    post:
      tags:
      - Temporadas y Tarifas
      summary: Registrar una temporada (7.4)
      operationId: registrarTemporada
      description: Las temporadas no pueden solaparse entre sí (7.4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarTemporadaRequest'
      responses:
        '201':
          description: Temporada registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporadaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
    get:
      tags:
      - Temporadas y Tarifas
      summary: Listar las temporadas
      operationId: consultarTemporadas
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de temporadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaTemporada'

  /api/politicas-cancelacion:
    post:
      tags:
      - Políticas de Cancelación
      summary: Publicar una nueva versión de la política (F-07, 7.4)
      operationId: publicarPoliticaCancelacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicarPoliticaCancelacionRequest'
      responses:
        '201':
          description: Nueva versión publicada; las anteriores se conservan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCancelacionResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
    get:
      tags:
      - Políticas de Cancelación
      summary: Consultar el historial de versiones de la política
      operationId: consultarPoliticasCancelacion
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de versiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPoliticaCancelacion'

  /api/canales/disponibilidad:
    get:
      tags:
        - Canal Externo
      summary: 'Canal externo: consultar disponibilidad (10.3.1)'
      operationId: consultarDisponibilidadCanal
      parameters:
        - name: fechaEntrada
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-11-01'
        - name: fechaSalida
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-11-04'
        - name: personas
          in: query
          required: true
          description: Total de personas del grupo (todos cuentan para la capacidad, RN-02).
          schema:
            type: integer
            format: int32
            minimum: 1
            example: 2
      responses:
        '200':
          description: Apartamentos disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
      security:
        - canalCredencial: []

  /api/canales/reservas-externas:
    post:
      tags:
      - Canal Externo
      summary: 'Canal externo: crear una reserva externa (RN-18, RN-19)'
      operationId: recibirReservaExterna
      description: Si colisiona con una reserva vigente se rechaza con 409 y queda registrada como conflicto para
        el administrador; nunca sobrescribe la reserva existente (RN-18).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecibirReservaExternaRequest'
      responses:
        '201':
          description: Reserva externa creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
          headers:
            Location:
              description: URL de la reserva creada
              schema:
                type: string
                example: /api/reservas/RES-2026-00001
        '200':
          description: 'Mensaje repetido: ya existía una reserva con este canal y código externo; se devuelve la
            misma, sin duplicarla (RN-19).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
      security:
      - canalCredencial: []

  /api/canales/reservas-externas/{codigoExterno}/cancelar:
    put:
      tags:
      - Canal Externo
      summary: 'Canal externo: cancelar una reserva externa (10.3.1)'
      operationId: cancelarReservaExterna
      parameters:
      - name: codigoExterno
        in: path
        required: true
        schema:
          type: string
          example: BKG-998877
      responses:
        '200':
          description: Reserva cancelada con la política congelada (RN-13)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
      security:
      - canalCredencial: []

  /api/conflictos-canal/{id}/resolver:
    put:
      tags:
      - Canal Externo
      summary: Resolver un conflicto de canal (administrador, 7.8)
      operationId: resolverConflictoCanal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: CONF-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolverConflictoCanalRequest'
      responses:
        '200':
          description: Conflicto resuelto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'

components:
  parameters:
    CodigoReserva:
      name: codigo
      in: path
      required: true
      description: Código de la reserva (formato RES-AAAA-NNNNN).
      schema:
        type: string
        pattern: ^RES-\d{4}-\d{5}$
        example: RES-2026-00001
    IdentificacionApartamento:
      name: identificacion
      in: path
      required: true
      schema:
        type: string
        example: AP001
    Pagina:
      name: page
      in: query
      required: false
      description: Número de página, desde 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Tamano:
      name: size
      in: query
      required: false
      description: Tamaño de página. El proyecto exige 10 por página (12.4).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 10
        default: 10
  schemas:
    ApartamentoEstadoResponse.ApartamentoEstadoDetalleDto:
      type: object
      properties:
        identificacionApartamento:
          type: string
          example: AP001
        nombre:
          type: string
          example: Familiar
        estadoOperativo:
          type: string
          example: PREPARADO
        codigoReservaActual:
          type: string
        observaciones:
          type: string
          example: Sin novedades
    CambiarEstadoOperativoRequest:
      type: object
      required:
      - nuevoEstado
      properties:
        nuevoEstado:
          type: string
          enum:
          - PREPARADO
          - OCUPADO
          - PENDIENTE_PREPARACION
          - EN_PREPARACION
          - FUERA_DE_SERVICIO
          example: PREPARADO
    CancelarReservaRequest:
      type: object
      required:
      - motivo
      properties:
        motivo:
          type: string
          minLength: 5
          maxLength: 300
          example: Mantenimiento de la cocina
    CerrarFolioRequest:
      type: object
      required:
      - autor
      - motivo
      properties:
        autor:
          type: string
          minLength: 1
          example: Administrador Juan Pérez
        motivo:
          type: string
          minLength: 5
          maxLength: 300
          example: Cierre de folio aprobado administrativamente
        observaciones:
          type: string
          maxLength: 300
          example: Sin novedades
    ConfigurarParametrosAlojamientoRequest:
      type: object
      required:
      - horaEntrada
      - horaSalida
      - horasPreparacion
      - horasPlazoConfirmacion
      - edadUmbralFacturable
      properties:
        horaEntrada:
          type: string
          format: time
          example: '14:00:00'
        horaSalida:
          type: string
          format: time
          example: '11:00:00'
        horaLimiteNoShow:
          type: string
          format: time
          example: '20:00:00'
        horasPreparacion:
          type: integer
          format: int32
          example: 3
        horasPlazoConfirmacion:
          type: integer
          format: int32
          example: 1
        edadUmbralFacturable:
          type: integer
          format: int32
          example: 5
        exigeAnticipo:
          type: boolean
          example: true
        porcentajeAnticipo:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          example: 50
    CorregirMovimientoRequest:
      type: object
      required:
      - movimientoIdOriginal
      - motivo
      properties:
        movimientoIdOriginal:
          type: string
          minLength: 1
        motivo:
          type: string
          minLength: 5
          maxLength: 300
          example: Mantenimiento de la cocina
    CotizacionRequest:
      type: object
      required:
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - ocupantes
      properties:
        identificacionApartamento:
          type: string
          minLength: 1
          example: AP001
        fechaEntrada:
          type: string
          format: date
          description: Debe ser una fecha futura.
          example: '2026-11-01'
        fechaSalida:
          type: string
          format: date
          example: '2026-11-04'
        ocupantes:
          type: array
