                example: /api/reservas/RES-2026-00001
        '200':
          description: 'Mensaje repetido: ya existía una reserva con este canal y código externo; se devuelve la misma, sin duplicarla (RN-19).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
      security:
      - canalCredencial: []

  /api/canales/reservas-externas/{codigoExterno}/cancelar:
    put:
      tags:
      - Canal Externo
      summary: 'Canal externo: cancelar una reserva externa (10.3.1)'
      operationId: cancelarReservaExterna
      parameters:
      - name: codigoExterno
        in: path
        required: true
        schema:
          type: string
          example: BKG-998877
      responses:
        '200':
          description: Reserva cancelada con la política congelada (RN-13)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
      security:
      - canalCredencial: []

  /api/conflictos-canal/{id}/resolver:
    put:
      tags:
      - Canal Externo
      summary: Resolver un conflicto de canal (administrador, 7.8)
      operationId: resolverConflictoCanal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: CONF-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolverConflictoCanalRequest'
      responses:
        '200':
          description: Conflicto resuelto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ReglaDeNegocio'
      description: 'Roles: Administrador.'

components:
  parameters:

    CodigoReserva:
      name: codigo
      in: path
      required: true
      description: Código de la reserva (formato RES-AAAA-NNNNN).
      schema:
        type: string
        pattern: ^RES-\d{4}-\d{5}$
        example: RES-2026-00001

    IdentificacionApartamento:
      name: identificacion
      in: path
      required: true
      schema:
        type: string
        example: AP001

    Pagina:
      name: page
      in: query
      required: false
      description: Número de página, desde 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    Tamano:
      name: size
      in: query
      required: false
      description: Tamaño de página. El proyecto exige 10 por página (12.4).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 10
        default: 10
  schemas:

    ApartamentoEstadoResponse.ApartamentoEstadoDetalleDto:
      type: object
      properties:
        identificacionApartamento:
          type: string
          example: AP001
        nombre:
          type: string
          example: Familiar
        estadoOperativo:
          type: string
          example: PREPARADO
          enum: &id006
          - PREPARADO
          - OCUPADO
          - PENDIENTE_PREPARACION
          - EN_PREPARACION
          - FUERA_DE_SERVICIO
        codigoReservaActual:
          type: string
        observaciones:
          type: string
          example: Sin novedades

    CambiarEstadoOperativoRequest:
      type: object
      required:
      - nuevoEstado
      properties:
        nuevoEstado:
          type: string
          enum:
          - PREPARADO
          - OCUPADO
          - PENDIENTE_PREPARACION
          - EN_PREPARACION
          - FUERA_DE_SERVICIO
          example: PREPARADO

    ActualizarApartamentoRequest:
      type: object
      required:
      - nombre
      - dormitorios
      - capacidadMaxima
      - limiteMascotas
      - tiempoPreparacionHoras
      - caracteristicas
      - imagenes
      properties:
        nombre:
          type: string
          example: Familiar
        dormitorios:
          type: integer
          format: int32
          minimum: 1
          example: 4
        capacidadMaxima:
          type: integer
          format: int32
          minimum: 1
          example: 10
        limiteMascotas:
          type: integer
          format: int32
          minimum: 0
          example: 2
        tiempoPreparacionHoras:
          type: integer
          format: int32
          minimum: 0
          maximum: 24
          example: 3
        caracteristicas:
          type: array
          items:
            type: string
          example:
          - Wifi
          - Balcón
        imagenes:
          type: array
          items:
            type: string
          example: []

    CrearApartamentoRequest:
      type: object
      required:
      - identificacion
      - nombre
      - dormitorios
      - capacidadMaxima
      - limiteMascotas
      - tiempoPreparacionHoras
      - caracteristicas
      - imagenes
      properties:
        identificacion:
          type: string
          example: AP001
        nombre:
          type: string
          example: Familiar
        dormitorios:
          type: integer
          format: int32
          minimum: 1
          example: 4
        capacidadMaxima:
          type: integer
          format: int32
          minimum: 1
          example: 10
        limiteMascotas:
          type: integer
          format: int32
          minimum: 0
          example: 2
        tiempoPreparacionHoras:
          type: integer
          format: int32
          minimum: 0
          maximum: 24
          example: 3
        caracteristicas:
          type: array
          items:
            type: string
          example:
          - Wifi
          - Balcón
        imagenes:
          type: array
          items:
            type: string
          example: []

    CancelarReservaRequest:
      type: object
      required:
