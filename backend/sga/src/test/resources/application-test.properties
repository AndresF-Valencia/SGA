# Perfil "test": lo activa build.gradle al correr ./gradlew test.
# Las pruebas usan H2 en memoria (con sintaxis de MySQL) para no depender de Docker,
# y cada ejecución arranca con una base limpia.
spring.datasource.url=jdbc:h2:mem:sga-pruebas;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
