spring.application.name=sga
# --- Base de datos H2 en memoria ---

spring.datasource.url=jdbc:h2:mem:sgadb

spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=

# --- Consola web de H2 ---

spring.h2.console.enabled=true

spring.h2.console.path=/h2-console

# --- JPA ---

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---

server.port=8080

# --- Parámetros del alojamiento, Ficha del Alojamiento (Guía 09) ---
sga.alojamiento.plazo-confirmacion-horas=1

# --- Seguridad: JWT (7.2) ---
# El secreto NO se versiona (12.4): se pone en la variable de entorno SGA_JWT_SECRETO (mínimo 32 caracteres).
# Si no está, la aplicación arranca con una clave temporal y los tokens vencen al reiniciar.
sga.jwt.secreto=${SGA_JWT_SECRETO:}
sga.jwt.expiracion-minutos=120
# Orígenes del frontend que pueden llamar a la API
sga.cors.origenes=http://localhost:5173

# --- Datos de prueba (12.3): un usuario por rol, clave de prueba Sanrocco123 ---
sga.datos-prueba.habilitado=true
sga.datos-prueba.clave=${SGA_CLAVE_PRUEBA:Sanrocco123}

# --- Notificaciones al titular (10.3.2, Opción A) ---
# consola = solo escribe el correo en el log (por defecto, funciona sin internet)
# correo  = envía correos reales por SMTP (necesita las variables de abajo)
sga.notificaciones.modo=${SGA_NOTIFICACIONES_MODO:consola}
sga.notificaciones.remitente=${SGA_CORREO_USUARIO:no-responder@sanrocco.co}
# Servidor SMTP (ej. Gmail). Usuario y contraseña NO se versionan (I-06): van en variables de entorno.
spring.mail.host=${SGA_CORREO_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${SGA_CORREO_USUARIO:}
spring.mail.password=${SGA_CORREO_CLAVE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Tiempo máximo de espera (I-03): si el servidor no responde en 5 s, se abandona el envío
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# El actuator no revisa el correo: sin credenciales saldría DOWN aunque la aplicación funcione bien
management.health.mail.enabled=false
